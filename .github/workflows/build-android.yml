name: Build Android APK

on:
  push:
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK licenses and install build tools
        run: |
          # ANDROID_HOME is pre-set on ubuntu-latest (/usr/local/lib/android/sdk)
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip
          ./gradle-8.6/bin/gradle wrapper \
            --project-dir android-agent \
            --gradle-version=8.6 \
            --distribution-type=bin
          chmod +x android-agent/gradlew

      - name: Build Debug APK
        working-directory: android-agent
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android-agent/app/build/outputs/apk/debug/app-debug.apk agent.apk
          echo "APK size: $(du -h agent.apk | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-apk
          path: agent.apk

      - name: Delete old release
        run: |
          gh release delete latest-agent --yes 2>/dev/null || true
          git push --delete origin latest-agent 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-agent
          name: "Android Agent APK"
          body: |
            Latest build of the Android agent APK.
            **Install:** enable Unknown Sources in Settings → Security, then open the APK.
            **Setup:** open the app once, tap Enable Background Access → enable in Accessibility settings.
            After setup the icon disappears and the service runs silently in the background.
          files: agent.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
